name: release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag version to release (e.g. v0.1.0)'
        required: false
        default: ''

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build-linux-x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read # checkout repository code
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate version and tag
        env:
          TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          CRATE_VER="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          TARGET_TAG="${INPUT_TAG:-$TAG}"
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "main" ]; then
            TARGET_TAG="v${CRATE_VER}"
          fi
          if [ "$TARGET_TAG" != "v${CRATE_VER}" ]; then
            echo "::error::Target tag '$TARGET_TAG' does not match Cargo.toml version 'v${CRATE_VER}'"
            exit 1
          fi
          echo "Target tag $TARGET_TAG matches workspace crate version $CRATE_VER"

      - name: Build release binaries
        run: cargo build --release --locked

      - name: Prepare distribution tarball
        env:
          TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          CRATE_VER="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          TARGET_TAG="${INPUT_TAG:-$TAG}"
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "main" ]; then
            TARGET_TAG="v${CRATE_VER}"
          fi
          VERSION="${TARGET_TAG#v}"
          DIST_DIR="dist"
          PKG_NAME="ocr-${VERSION}-linux-x86_64"
          STAGE_DIR="/tmp/${PKG_NAME}"

          mkdir -p "$DIST_DIR" "$STAGE_DIR"
          cp target/release/ocrd "$STAGE_DIR/"
          cp target/release/ocrd-client "$STAGE_DIR/"
          cp contrib/ocr "$STAGE_DIR/"
          cp contrib/ocrd.service "$STAGE_DIR/"
          cp contrib/hyprland.conf.example "$STAGE_DIR/"
          cp README.md "$STAGE_DIR/"
          cp LICENSE "$STAGE_DIR/"

          tar -czf "${DIST_DIR}/${PKG_NAME}.tar.gz" -C /tmp "$PKG_NAME"
          cd "$DIST_DIR"
          sha256sum "${PKG_NAME}.tar.gz" > SHA256SUMS.txt

      - name: Upload dist artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-x86_64
          path: dist/*
          retention-days: 7
          if-no-files-found: error

  github-release:
    name: github-release
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create release and upload assets
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux-x86_64
          path: dist/

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          CRATE_VER="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          TARGET_TAG="${INPUT_TAG:-$TAG}"
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "main" ]; then
            TARGET_TAG="v${CRATE_VER}"
          fi
          echo "Creating or updating GitHub Release for ${TARGET_TAG}"
          if gh release view "$TARGET_TAG" >/dev/null 2>&1; then
            echo "Release ${TARGET_TAG} exists, uploading assets..."
            gh release upload "$TARGET_TAG" dist/* --clobber
          else
            gh release create "$TARGET_TAG" dist/* --target "$GITHUB_SHA" --generate-notes
          fi

  publish-aur:
    name: publish-aur
    needs: [build, github-release]
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # checkout repository code
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish PKGBUILD to AUR
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_USERNAME: ${{ vars.AUR_USERNAME }}
          AUR_EMAIL: ${{ vars.AUR_EMAIL }}
          TAG: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${AUR_KEY:-}" ]; then
            echo "::warning::AUR_SSH_PRIVATE_KEY secret is not configured. Skipping publication to AUR."
            echo "To enable automatic AUR updates, add your AUR SSH private key to repository secrets."
            exit 0
          fi

          CRATE_VER="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          TARGET_TAG="${INPUT_TAG:-$TAG}"
          if [ -z "$TARGET_TAG" ] || [ "$TARGET_TAG" = "main" ]; then
            TARGET_TAG="v${CRATE_VER}"
          fi
          VERSION="${TARGET_TAG#v}"
          echo "Preparing AUR update for version ${VERSION}"

          ARCHIVE_URL="https://github.com/${REPO}/archive/refs/tags/${TARGET_TAG}.tar.gz"
          echo "Downloading source tarball from ${ARCHIVE_URL}..."
          TMP_ARCHIVE=$(mktemp --suffix=.tar.gz)
          curl -sSfL --retry 5 --retry-delay 2 --retry-all-errors -o "$TMP_ARCHIVE" "$ARCHIVE_URL"

          # Verify the downloaded archive is a valid gzipped tarball
          tar -tzf "$TMP_ARCHIVE" >/dev/null

          TARBALL_SHA=$(sha256sum "$TMP_ARCHIVE" | cut -d' ' -f1)
          if [ -z "$TARBALL_SHA" ] || [ ${#TARBALL_SHA} -ne 64 ]; then
            echo "::error::Invalid SHA256 computed: '$TARBALL_SHA'"
            exit 1
          fi
          echo "Verified Tarball SHA256: ${TARBALL_SHA}"

          AUR_WORK_DIR=$(mktemp -d)
          cp aur/PKGBUILD "${AUR_WORK_DIR}/PKGBUILD"

          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" "${AUR_WORK_DIR}/PKGBUILD"
          sed -i "s/^pkgrel=.*/pkgrel=1/" "${AUR_WORK_DIR}/PKGBUILD"
          sed -i "s/^sha256sums=.*/sha256sums=('${TARBALL_SHA}')/" "${AUR_WORK_DIR}/PKGBUILD"

          docker run --rm -v "${AUR_WORK_DIR}:/pkg" -w /tmp \
            archlinux@sha256:2de80105abb49f813a85393c6758a4334deb6bcec4a2411bd2f059c0bee6ee4c \
            bash -c 'useradd -m builder && cp -r /pkg /home/builder/pkg && chown -R builder:builder /home/builder/pkg && su builder -c "cd /home/builder/pkg && makepkg --printsrcinfo > .SRCINFO" && cp /home/builder/pkg/.SRCINFO /pkg/.SRCINFO'

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUR_KEY" | tr -d '\r' > ~/.ssh/aur_deploy_key
          chmod 600 ~/.ssh/aur_deploy_key

          # Known host keys for aur.archlinux.org
          printf '%s\n%s\n' \
            'aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN' \
            'aur.archlinux.org ssh-rsa ' \
            > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

          AUR_CLONE_DIR=$(mktemp -d)
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_deploy_key -o StrictHostKeyChecking=yes"

          if ! git clone "ssh://aur@aur.archlinux.org/ocr.git" "$AUR_CLONE_DIR"; then
            echo "AUR repository clone failed or uninitialized. Initializing empty repository..."
            git init -b master "$AUR_CLONE_DIR"
            git -C "$AUR_CLONE_DIR" remote add origin "ssh://aur@aur.archlinux.org/ocr.git"
          fi

          cd "$AUR_CLONE_DIR"
          git checkout -B master
          cp "${AUR_WORK_DIR}/PKGBUILD" .
          cp "${AUR_WORK_DIR}/.SRCINFO" .

          AUR_USER="${AUR_USERNAME:-Luis Henrique}"
          AUR_MAIL="${AUR_EMAIL:-luishenrique.gbarbosa21@gmail.com}"
          git config user.name "$AUR_USER"
          git config user.email "$AUR_MAIL"
          git add PKGBUILD .SRCINFO

          if git diff --cached --quiet; then
            echo "No changes detected for AUR."
          else
            git commit -m "Update to v${VERSION}"
            git push -u origin master
            echo "Successfully deployed v${VERSION} to AUR!"
          fi
