[package]
name = "ocrd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Resident OCR daemon: models stay hot, a Unix socket answers ocrd-client"

[[bin]]
name = "ocrd"
path = "src/main.rs"

[features]
# Forwarded to ocr-core. A GPU feature also needs the matching runtime on the
# host (report section 4); the daemon probes before trusting it.
#   cuda     -> NVIDIA         (prebuilt ORT + cuDNN 9)
#   openvino -> Intel iGPU/Arc (needs a system ORT built with OpenVINO)
#   directml -> Windows, any GPU
# AMD on Linux (--accel webgpu) needs a source build of ONNX Runtime with Dawn;
# there is no feature flag because ort/webgpu breaks the prebuilt binary.
default = ["download-binaries", "auto-download"]
download-binaries = ["ocr-core/download-binaries"]
auto-download = ["ocr-core/auto-download"]
cuda = ["ocr-core/cuda"]
openvino = ["ocr-core/openvino"]
directml = ["ocr-core/directml"]

[dependencies]
ocr-core.workspace = true
ocr-proto.workspace = true
clap.workspace = true
serde_json.workspace = true
base64.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
signal-hook = "0.4"
