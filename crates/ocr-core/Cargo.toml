[package]
name = "ocr-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Isolation boundary around oar-ocr: one detector, three PP-OCRv5 recognizers, recognize() -> Vec<TextLine>"

[features]
# CPU is the baseline (report 2.9). `download-binaries` lets `ort` fetch a
# matching ONNX Runtime; `auto-download` lets oar-ocr fetch the ONNX models by
# registered name. `cuda` additionally pulls the ORT CUDA execution provider —
# the daemon still probes at runtime before trusting it.
default = ["download-binaries", "auto-download"]
download-binaries = ["oar-ocr/download-binaries"]
auto-download = ["oar-ocr/auto-download"]
# Accelerator execution providers. None are in `default` — a plain build stays
# CPU-only. Each is an opt-in and the daemon probes it before trusting it.
#
# `cuda` works with the ONNX Runtime that `download-binaries` fetches (given
# cuDNN 9 on the host). `openvino` and `directml` are NOT in those prebuilt
# binaries: enabling them requires a system ONNX Runtime built with that EP
# (`ORT_STRATEGY=system` + `ORT_LIB_LOCATION`, see https://ort.pyke.io/setup/linking).
# There is no `webgpu` feature: the prebuilt ORT for Linux pulls libwebgpu_dawn.so
# as a hard dependency that it does not ship, which makes the whole binary fail to
# load. `--accel webgpu` therefore always errors cleanly until ORT is built from
# source with Dawn.
cuda = ["oar-ocr/cuda", "ort/cuda"]                # NVIDIA
openvino = ["oar-ocr/openvino", "ort/openvino"]    # Intel iGPU / Arc / NPU
directml = ["oar-ocr/directml", "ort/directml"]    # Windows only (AMD/Intel/NVIDIA)

[dependencies]
ocr-proto.workspace = true
oar-ocr.workspace = true
ort.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
tracing.workspace = true

[dev-dependencies]
tracing-subscriber.workspace = true
